<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygolf</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>

    <h1>Polygolf</h1>
    <p>Write your valid JS and Python CRC32 code below and hit "Run" to execute:</p>

    <textarea id="code" placeholder="Enter your code here..."></textarea><br>

    <button onclick="runCode()">Run</button>

    <div id="result" class="result" style="display:none;"></div>

    <script>
        function runCode() {
            const code = document.getElementById('code').value;
            const resultDiv = document.getElementById('result');
            
            // Clear previous result
            resultDiv.style.display = 'none';
            resultDiv.textContent = '';

            if (!code) {
                alert("Please enter some code!");
                return;
            }

            // Send code to the backend
            fetch('/run', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ code: code })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    resultDiv.classList.add('error');
                    resultDiv.classList.remove('success');
                    resultDiv.textContent = data.error;
                } else {
                    resultDiv.classList.add('success');
                    resultDiv.classList.remove('error');
                    resultDiv.textContent = data.success;
                }
                resultDiv.style.display = 'block';
            })
            .catch(error => {
                resultDiv.classList.add('error');
                resultDiv.classList.remove('success');
                resultDiv.textContent = "An error occurred while executing the code.";
                resultDiv.style.display = 'block';
            });
        }
    </script>

</body>
</html>
