<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Album</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .gallery img {
            width: 200px;
            height: auto;
            margin: 10px;
            border-radius: 5px;
            box-shadow: 0px 0px 5px #888;
        }
        .file-list {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>📸 Photo Album</h1>
    <p>Here are your uploaded images:</p>

    <div class="gallery">
        {% for image in images %}
            <div>
                <a href="{{ url_for('serve_image', filename=image) }}">
                    <img src="{{ url_for('serve_image', filename=image) }}" alt="{{ image }}">
                </a>
                <p>{{ image }}</p>
            </div>
        {% endfor %}
    </div>

    <p><a href="/">⬅️ Upload More</a></p>
</body>
</html>
