<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Submit a Bug</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% include "nav.html" %}
  <div class="container">
    <h2>Submit a Bug</h2>
    <label>Title</label>
    <input id="bug-title" type="text" />
    <label>Description</label>
    <textarea id="bug-description"></textarea>
    <label>Severity</label>
    <select id="bug-severity">
      <option>low</option>
      <option>medium</option>
      <option>high</option>
    </select>
    <button onclick="submitBug()">Submit</button>
    <div id="submit-result"></div>
  </div>

  <script>
    function submitBug() {
      const title = document.getElementById('bug-title').value;
      const description = document.getElementById('bug-description').value;
      const severity = document.getElementById('bug-severity').value;

      fetch('/create_bug', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({ title, description, severity })
      })
      .then(res => {
        if (res.status === 401 || res.status === 403) {
          window.location.href = "/login";
          return Promise.reject("Redirecting to login...");
        }
        return res;
      })
      .then(res => res.json())
      .then(data => {
        const div = document.getElementById('submit-result');
        if (data.success) {
          div.innerText = "Bug submitted successfully!";
        } else {
          div.innerText = "Error: " + (data.error || JSON.stringify(data));
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById('submit-result').innerText = "Error submitting bug.";
      });
    }

    function checkToken() {
      const token = localStorage.getItem('jwtToken');
      if (!token) {
        alert("You must be logged in. Token not found.");
        window.location.href = "/login";
      }
    }

    window.onload = checkToken;
  </script>
</body>
</html>
